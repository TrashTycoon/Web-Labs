<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21 — Карткова дуель</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #101010;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .game {
            width: 100%;
            max-width: 760px;
            padding: 32px;
            background: #191919;
            border: 1px solid #383228;
            border-radius: 18px;
            text-align: center;
        }
        h1 { color: #ffcf36; margin: 0 0 8px; font-size: 36px; }
        .subtitle { color: #b5b5b5; margin: 0 0 24px; line-height: 1.5; }
        #round { color: #ffcf36; font-size: 15px; font-weight: bold; letter-spacing: 1px; }
        .players { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 20px 0; }
        .player {
            min-width: 0;
            padding: 20px 12px;
            background: #222;
            border: 1px solid #383838;
            border-radius: 12px;
        }
        .player h2 { margin: 0 0 12px; font-size: 19px; overflow-wrap: anywhere; }
        .score { display: inline-block; min-width: 76px; padding: 7px 15px; background: #ffcf36; color: #141414; border-radius: 6px; font-size: 23px; font-weight: bold; }
        .score-label { color: #b5b5b5; font-size: 12px; margin: 6px 0 20px; }
        .card {
            position: relative;
            width: 132px;
            max-width: 100%;
            aspect-ratio: 2 / 3;
            margin: 0 auto;
            border: 2px solid #ffcf36;
            border-radius: 10px;
            background: #151515;
            color: #ffcf36;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color .2s, color .2s;
        }
        .card.open { background: #ffcf36; color: #171717; }
        .corner { position: absolute; top: 9px; left: 10px; font-size: 16px; font-weight: bold; }
        .corner.bottom { top: auto; left: auto; right: 10px; bottom: 9px; transform: rotate(180deg); }
        .rank { font-size: 42px; font-weight: bold; line-height: 1; }
        .suit { font-size: 48px; line-height: 1.1; }
        .card-value { min-height: 18px; color: #c0c0c0; font-size: 14px; margin: 12px 0 0; }
        #message { min-height: 48px; display: flex; justify-content: center; align-items: center; padding: 12px; background: #141414; border-radius: 8px; line-height: 1.4; }
        .buttons { display: flex; gap: 12px; margin-top: 18px; justify-content: center; }
        button { border: 1px solid #ffcf36; border-radius: 8px; padding: 13px 22px; font-size: 15px; font-weight: bold; cursor: pointer; }
        #draw { background: #ffcf36; color: #151515; }
        #draw:hover:not(:disabled) { background: #ffe17a; }
        #draw:disabled { opacity: .4; cursor: not-allowed; }
        #restart { background: transparent; color: #ffcf36; }
        #restart:hover { background: #342b10; }
        button:focus-visible { outline: 2px solid white; outline-offset: 3px; }
        @media (max-width: 480px) {
            .game { padding: 20px 12px; }
            h1 { font-size: 28px; }
            .players { gap: 8px; }
            .player { padding: 14px 8px; }
            .player h2 { font-size: 16px; }
            .card { width: 104px; }
            .rank { font-size: 32px; }
            .suit { font-size: 38px; }
            .corner { font-size: 13px; }
            .buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <main class="game">
        <h1>21 · Карткова дуель</h1>
        <p class="subtitle">Три раунди. Перемагає той, хто набере більше очок.</p>
        <div id="round">Раунд 0 з 3</div>
        <div class="players">
            <section class="player" id="userPanel">
                <h2 id="userName">Гравець</h2>
                <div class="score" id="userScore">0</div>
                <div class="score-label">СУМА ОЧОК</div>
                <div class="card" id="userCard">
                    <span class="corner"></span><span class="rank">?</span>
                    <span class="suit">♠</span><span class="corner bottom"></span>
                </div>
                <p class="card-value" id="userValue">Карту не відкрито</p>
            </section>
            <section class="player" id="computerPanel">
                <h2>Комп'ютер</h2>
                <div class="score" id="computerScore">0</div>
                <div class="score-label">СУМА ОЧОК</div>
                <div class="card" id="computerCard">
                    <span class="corner"></span><span class="rank">?</span>
                    <span class="suit">♠</span><span class="corner bottom"></span>
                </div>
                <p class="card-value" id="computerValue">Карту не відкрито</p>
            </section>
        </div>
        <div id="message" aria-live="polite">Натисніть кнопку, щоб відкрити карти.</div>
        <div class="buttons">
            <button id="draw">Відкрити карти</button>
            <button id="restart">Нова гра</button>
        </div>
    </main>
    <script>
        const cards = [
            { rank: "6", value: 6 },
            { rank: "7", value: 7 },
            { rank: "8", value: 8 },
            { rank: "9", value: 9 },
            { rank: "10", value: 10 },
            { rank: "J", value: 2 },
            { rank: "Q", value: 3 },
            { rank: "K", value: 4 },
            { rank: "A", value: 11 }
        ];
        const suits = ["♠", "♥", "♦", "♣"];
        let userScore = 0;
        let computerScore = 0;
        let round = 0;
        let userName = prompt("Введіть своє ім'я:");

        while (userName !== null && (userName.trim().length === 0 || userName.trim().length > 25)) {
            userName = prompt("Введіть ім'я від 1 до 25 символів:");
        }
        if (userName === null) {
            userName = "Гравець";
        } else {
            userName = userName.trim();
        }
        document.getElementById("userName").textContent = userName;

        const drawButton = document.getElementById("draw");
        const restartButton = document.getElementById("restart");
        const message = document.getElementById("message");
        const userPanel = document.getElementById("userPanel");
        const computerPanel = document.getElementById("computerPanel");

        function getRandomCard() {
            let index = Math.floor(Math.random() * cards.length);
            return cards[index];
        }

        function showCard(id, card) {
            let element = document.getElementById(id);
            let suit = suits[Math.floor(Math.random() * suits.length)];
            element.querySelector(".rank").textContent = card.rank;
            element.querySelector(".suit").textContent = suit;
            let corners = element.querySelectorAll(".corner");
            for (let corner of corners) {
                corner.textContent = card.rank + suit;
            }
            element.classList.add("open");
        }

        function highlight(userWins, computerWins) {
            userPanel.style.borderColor = userWins ? "#ffcf36" : "#383838";
            computerPanel.style.borderColor = computerWins ? "#ffcf36" : "#383838";
        }

        function updateScore() {
            document.getElementById("userScore").textContent = userScore;
            document.getElementById("computerScore").textContent = computerScore;
            document.getElementById("round").textContent = "Раунд " + round + " з 3";
        }

        function playRound() {
            if (round >= 3) return;
            let userCard = getRandomCard();
            let computerCard = getRandomCard();
            round++;
            userScore += userCard.value;
            computerScore += computerCard.value;
            showCard("userCard", userCard);
            showCard("computerCard", computerCard);
            document.getElementById("userValue").textContent = "Очки за карту: " + userCard.value;
            document.getElementById("computerValue").textContent = "Очки за карту: " + computerCard.value;
            updateScore();
            highlight(userCard.value > computerCard.value, computerCard.value > userCard.value);

            if (round === 3) {
                finishGame();
            } else if (userCard.value > computerCard.value) {
                message.textContent = "Ваша карта має більше очок!";
            } else if (computerCard.value > userCard.value) {
                message.textContent = "Карта комп'ютера має більше очок.";
            } else {
                message.textContent = "Карти мають однакову кількість очок.";
            }
        }

        function finishGame() {
            drawButton.disabled = true;
            message.style.color = "#ffcf36";
            message.style.fontWeight = "bold";
            highlight(userScore > computerScore, computerScore > userScore);
            if (userScore > computerScore) {
                message.textContent = userName + ", ви перемогли!";
            } else if (computerScore > userScore) {
                message.textContent = "Комп'ютер переміг!";
            } else {
                message.textContent = "Нічия!";
            }
        }

        function resetCard(id) {
            let element = document.getElementById(id);
            element.classList.remove("open");
            element.querySelector(".rank").textContent = "?";
            element.querySelector(".suit").textContent = "♠";
            for (let corner of element.querySelectorAll(".corner")) {
                corner.textContent = "";
            }
        }

        function restartGame() {
            userScore = 0;
            computerScore = 0;
            round = 0;
            updateScore();
            resetCard("userCard");
            resetCard("computerCard");
            document.getElementById("userValue").textContent = "Карту не відкрито";
            document.getElementById("computerValue").textContent = "Карту не відкрито";
            highlight(false, false);
            message.style.color = "#f5f5f5";
            message.style.fontWeight = "normal";
            message.textContent = "Натисніть кнопку, щоб відкрити карти.";
            drawButton.disabled = false;
        }

        drawButton.addEventListener("click", playRound);
        restartButton.addEventListener("click", restartGame);
    </script>
</body>
</html>
